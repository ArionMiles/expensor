# Explicit PostgreSQL deployment.
#
# Start:  docker compose -f docker-compose.postgres.yml up -d
# Open:   http://localhost:8080
#
# Generate an encryption key with `openssl rand -base64 32` and set
# EXPENSOR_SECRET_KEY in your shell or a .env file before starting.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: expensor
      POSTGRES_USER: expensor
      POSTGRES_PASSWORD: ${EXPENSOR_POSTGRES_PASSWORD:-expensor_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expensor"]
      interval: 10s
      timeout: 5s
      retries: 5

  expensor:
    image: ghcr.io/arionmiles/expensor:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      EXPENSOR_DB_BACKEND: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: expensor
      POSTGRES_USER: expensor
      POSTGRES_PASSWORD: ${EXPENSOR_POSTGRES_PASSWORD:-expensor_password}
      POSTGRES_SSLMODE: disable
      EXPENSOR_SECRET_KEY: ${EXPENSOR_SECRET_KEY:?set EXPENSOR_SECRET_KEY with openssl rand -base64 32}
      LOG_LEVEL: INFO
      # BASE_URL: http://localhost:8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
