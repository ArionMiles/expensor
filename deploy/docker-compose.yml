# Default SQLite deployment.
#
# Start:  docker compose up -d
# Open:   http://localhost:8080
# Setup:  follow the onboarding wizard to connect Gmail or Thunderbird.
#
# Generate an encryption key with `openssl rand -base64 32` and set
# EXPENSOR_SECRET_KEY in your shell or a .env file before starting.
# Existing PostgreSQL deployments must continue with docker-compose.postgres.yml
# to use their current postgres_data volume.

services:
  expensor:
    image: ghcr.io/arionmiles/expensor:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      EXPENSOR_DB_BACKEND: sqlite
      EXPENSOR_SQLITE_PATH: /app/data/expensor/expensor.db
      EXPENSOR_SECRET_KEY: ${EXPENSOR_SECRET_KEY:?set EXPENSOR_SECRET_KEY with openssl rand -base64 32}
      LOG_LEVEL: INFO
      # BASE_URL: http://localhost:8080
    volumes:
      - expensor_data:/app/data
      # Thunderbird only: add a read-only profile mount here.
      # - /path/to/Thunderbird/Profiles/your.profile:/thunderbird-profile:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  expensor_data:
