# Release workflow
# Triggered when a new tag is pushed (v*.*.*)
# Builds container and native artifacts, then creates a GitHub release.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build and push multi-platform Docker image using cross-compilation.
  # Builder stages use --platform=$BUILDPLATFORM so the Go toolchain and Node
  # run natively on the amd64 host; GOOS/GOARCH handle arm64 targeting without QEMU.
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
          fetch-depth: 0

      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=v{{version}},value=${{ steps.version.outputs.VERSION }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ steps.version.outputs.VERSION }}
            type=semver,pattern=v{{major}},value=${{ steps.version.outputs.VERSION }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.VERSION, '-') }}
          labels: |
            org.opencontainers.image.description=Email-driven personal finance tracker with SQLite and PostgreSQL storage
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.vendor=ArionMiles
            org.opencontainers.image.documentation=https://github.com/ArionMiles/expensor#readme

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  build-native:
    name: Build Native Archives
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build native archives
        uses: docker/build-push-action@v7
        with:
          context: .
          target: release-artifacts
          build-args: VERSION=${{ steps.version.outputs.VERSION }}
          outputs: type=local,dest=dist/release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload native archives
        uses: actions/upload-artifact@v7
        with:
          name: native-release-artifacts
          path: dist/release
          if-no-files-found: error

  # Create GitHub Release
  create-release:
    name: Create GitHub Release
    needs: [build-docker, build-native]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download native archives
        uses: actions/download-artifact@v8
        with:
          name: native-release-artifacts
          path: dist/release

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            dist/release/*
            install.sh
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post release summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Release ${{ steps.version.outputs.VERSION }} Published

          ## Artifacts
          - Docker image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}\`
          - Native archives and checksums: [release assets](https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.VERSION }})

          ## Links
          - [Release Page](https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.VERSION }})
          - [Docker Image](https://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }})
          EOF
